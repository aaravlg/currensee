<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Currency Classifier - Accessibility Demo</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --accent: #6c63ff;
    --accent-soft: #6c63ff33;
    --text: #f2f2f2;
    --muted: #9a9ea6;
    --good: #3ddc97;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 60px;
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    margin: 4px 0 2px;
    text-align: center;
  }
  p.subtitle {
    color: var(--muted);
    font-size: 0.9rem;
    margin: 0 0 20px;
    text-align: center;
  }
  #camera-wrap {
    position: relative;
    width: 100%;
    max-width: 420px;
    aspect-ratio: 1 / 1;
    background: #000;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 0 0 2px var(--accent-soft);
  }
  #webcam-container video, #webcam-container canvas {
    width: 100% !important;
    height: 100% !important;
    object-fit: cover;
  }
  #scan-btn {
    margin-top: 22px;
    width: 100%;
    max-width: 420px;
    padding: 18px;
    font-size: 1.1rem;
    font-weight: 600;
    border: none;
    border-radius: 14px;
    background: var(--accent);
    color: white;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.2s ease;
  }
  #scan-btn:active { transform: scale(0.97); }
  #scan-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  #result-card {
    margin-top: 18px;
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 16px;
    padding: 18px 20px;
    min-height: 60px;
  }
  #result-label {
    font-size: 1.5rem;
    font-weight: 700;
  }
  #result-conf {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 4px;
  }
  #status {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 10px;
    text-align: center;
    min-height: 18px;
  }
  .bar-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 6px;
    font-size: 0.75rem;
    color: var(--muted);
  }
  .bar-track {
    flex: 1;
    height: 6px;
    background: #2a2e37;
    border-radius: 4px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: var(--accent);
  }
  footer {
    margin-top: 30px;
    font-size: 0.75rem;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>

<h1>Currency Note Identifier</h1>
<p class="subtitle">Point the camera at a note, then tap Scan</p>

<div id="camera-wrap">
  <div id="webcam-container"></div>
</div>

<button id="scan-btn" disabled>Loading model…</button>

<div id="result-card">
  <div id="result-label">—</div>
  <div id="result-conf"></div>
  <div id="all-bars"></div>
</div>

<div id="status"></div>

<footer>Runs fully on-device • No data leaves your browser</footer>

<!-- TensorFlow.js and Teachable Machine image library -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

<script>
// ---- CONFIGURE THIS ----
// Point to your exported model folder (containing model.json, metadata.json, weights.bin)
// This can be a local relative path (e.g. "./model/") for fully offline use,
// or a hosted URL if using Teachable Machine's shareable link / Firebase.
const MODEL_URL = "./model/";
// -------------------------

let model, webcam, maxPredictions;
let isScanning = false;

const scanBtn = document.getElementById("scan-btn");
const resultLabel = document.getElementById("result-label");
const resultConf = document.getElementById("result-conf");
const allBars = document.getElementById("all-bars");
const statusEl = document.getElementById("status");

const CONFIDENCE_THRESHOLD = 0.75; // below this, ask user to try again

async function init() {
  try {
    statusEl.textContent = "Loading model…";
    const modelURL = MODEL_URL + "model.json";
    const metadataURL = MODEL_URL + "metadata.json";
    model = await tmImage.load(modelURL, metadataURL);
    maxPredictions = model.getTotalClasses();

    statusEl.textContent = "Requesting camera access…";
    const flip = false; // set true if using front-facing camera and want mirror
    webcam = new tmImage.Webcam(320, 320, flip);
    await webcam.setup({ facingMode: "environment" }); // rear camera on phones
    await webcam.play();
    document.getElementById("webcam-container").appendChild(webcam.canvas);

    requestAnimationFrame(loop);

    scanBtn.disabled = false;
    scanBtn.textContent = "Scan Note";
    statusEl.textContent = "Ready";
  } catch (err) {
    console.error(err);
    statusEl.textContent = "Error: " + err.message + " (check model path / camera permission)";
  }
}

async function loop() {
  webcam.update();
  requestAnimationFrame(loop);
}

async function scan() {
  if (isScanning) return;
  isScanning = true;
  scanBtn.disabled = true;
  scanBtn.textContent = "Scanning…";

  const predictions = await model.predict(webcam.canvas);
  predictions.sort((a, b) => b.probability - a.probability);

  renderBars(predictions);

  const top = predictions[0];
  const label = top.className;
  const conf = top.probability;

  if (conf < CONFIDENCE_THRESHOLD) {
    resultLabel.textContent = "Not sure — try again";
    resultConf.textContent = `(best guess: ${label}, ${(conf * 100).toFixed(0)}%)`;
    speak("Could not identify clearly. Please try again.");
  } else if (label.toLowerCase() === "invalid") {
    resultLabel.textContent = "No valid note detected";
    resultConf.textContent = `${(conf * 100).toFixed(0)}% confidence`;
    speak("No currency note detected.");
  } else {
    resultLabel.textContent = `₹${label} Note`;
    resultConf.textContent = `${(conf * 100).toFixed(0)}% confidence`;
    speak(`${label} rupee note`);
  }

  isScanning = false;
  scanBtn.disabled = false;
  scanBtn.textContent = "Scan Note";
}

function renderBars(predictions) {
  allBars.innerHTML = "";
  predictions.forEach(p => {
    const row = document.createElement("div");
    row.className = "bar-row";
    const pct = (p.probability * 100).toFixed(0);
    row.innerHTML = `
      <span style="width:70px; flex-shrink:0;">${p.className}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <span style="width:36px; text-align:right;">${pct}%</span>
    `;
    allBars.appendChild(row);
  });
}

function speak(text) {
  if (!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel(); // stop any ongoing speech
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 0.95;
  window.speechSynthesis.speak(utter);
}

scanBtn.addEventListener("click", scan);
window.addEventListener("load", init);
</script>

</body>
</html>
