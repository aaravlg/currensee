<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CurrenSee — How It Works</title>
<style>
  :root {
    --bg: #0d0f14;
    --accent: #7c6dfb;
    --accent2: #34d8c8;
    --muted: #9a9ea6;
    --text: #f4f4f6;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: 'Segoe UI', -apple-system, Roboto, Arial, sans-serif;
    background:
      radial-gradient(circle at 15% 5%, #7c6dfb22, transparent 40%),
      radial-gradient(circle at 85% 95%, #34d8c822, transparent 40%),
      var(--bg);
    color: var(--text);
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  #top-bar {
    width: 100%;
    max-width: 1100px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    font-size: 0.85rem;
    color: var(--muted);
    flex-shrink: 0;
  }
  #top-bar a { color: var(--muted); text-decoration: none; }
  #top-bar a:hover { color: var(--accent2); }
  #proj-name-top { color: var(--accent2); font-weight: 700; }

  #stage {
    width: 100%;
    max-width: 1100px;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    position: relative;
  }
  #slide-frame {
    position: relative;
    width: 100%;
    aspect-ratio: 960 / 540;
    max-height: 100%;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 25px 70px rgba(0,0,0,0.5);
    border: 1px solid #2a2e37;
    background: #fff;
  }
  #slide-frame img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }
  #slide-frame img.active {
    opacity: 1;
    pointer-events: auto;
  }

  .edge-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(20, 22, 28, 0.75);
    border: 1px solid #3a3e47;
    color: var(--text);
    font-size: 1.2rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
    backdrop-filter: blur(4px);
    transition: background 0.2s ease;
  }
  .edge-btn:hover { background: var(--accent); }
  .edge-btn:disabled { opacity: 0.25; cursor: not-allowed; background: rgba(20,22,28,0.5); }
  #prev-btn { left: -14px; }
  #next-btn { right: -14px; }

  #bottom-bar {
    width: 100%;
    max-width: 1100px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    padding-top: 18px;
    flex-shrink: 0;
  }
  .dots { display: flex; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #3a3e47; cursor: pointer; transition: all 0.2s; }
  .dot.active { background: var(--accent2); width: 24px; border-radius: 4px; }

  #slide-counter {
    font-size: 0.8rem;
    color: var(--muted);
    margin-left: 14px;
    min-width: 48px;
  }
</style>
</head>
<body>

<div id="top-bar">
  <span><span id="proj-name-top">CurrenSee</span> — How It Works</span>
  <a href="index.html">← Back to app</a>
</div>

<div id="stage">
  <button id="prev-btn" class="edge-btn" onclick="go(current - 1)" aria-label="Previous slide">‹</button>
  <div id="slide-frame">
    <img src="slides/Slide1.svg" class="active" data-index="0" alt="Slide 1">
    <img src="slides/Slide2.svg" data-index="1" alt="Slide 2">
    <img src="slides/Slide3.svg" data-index="2" alt="Slide 3">
    <img src="slides/Slide4.svg" data-index="3" alt="Slide 4">
    <img src="slides/Slide5.svg" data-index="4" alt="Slide 5">
    <img src="slides/Slide6.svg" data-index="5" alt="Slide 6">
    <img src="slides/Slide7.svg" data-index="6" alt="Slide 7">
  </div>
  <button id="next-btn" class="edge-btn" onclick="go(current + 1)" aria-label="Next slide">›</button>
</div>

<div id="bottom-bar">
  <div class="dots" id="dots"></div>
  <span id="slide-counter">1 / 7</span>
</div>

<script>
const slides = document.querySelectorAll("#slide-frame img");
const dotsEl = document.getElementById("dots");
const counterEl = document.getElementById("slide-counter");
const prevBtn = document.getElementById("prev-btn");
const nextBtn = document.getElementById("next-btn");
let current = 0;

function renderDots() {
  dotsEl.innerHTML = "";
  slides.forEach((_, i) => {
    const d = document.createElement("div");
    d.className = "dot" + (i === current ? " active" : "");
    d.onclick = () => go(i);
    dotsEl.appendChild(d);
  });
}

function go(index) {
  if (index < 0 || index >= slides.length) return;
  current = index;
  slides.forEach((s, i) => s.classList.toggle("active", i === index));
  renderDots();
  counterEl.textContent = `${current + 1} / ${slides.length}`;
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === slides.length - 1;
}

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") go(current + 1);
  if (e.key === "ArrowLeft") go(current - 1);
});

renderDots();
go(0);
</script>

</body>
</html>
