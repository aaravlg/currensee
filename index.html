<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CurrenSee - Accessibility Demo</title>
<style>
  :root {
    --bg: #0d0f14;
    --card: #171a21;
    --card2: #1d212a;
    --accent: #7c6dfb;
    --accent2: #34d8c8;
    --accent-soft: #7c6dfb2b;
    --text: #f4f4f6;
    --muted: #9a9ea6;
    --good: #3ddc97;
    --warn: #ffb84d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', -apple-system, Roboto, Arial, sans-serif;
    background:
      radial-gradient(circle at 15% 5%, #7c6dfb22, transparent 40%),
      radial-gradient(circle at 85% 95%, #34d8c822, transparent 40%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 16px 50px;
  }
  .logo-badge {
    width: 56px; height: 56px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem;
    margin-bottom: 12px;
    box-shadow: 0 8px 24px var(--accent-soft);
  }
  h1 {
    font-size: 1.65rem;
    font-weight: 800;
    margin: 0 0 4px;
    text-align: center;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.01em;
  }
  p.subtitle {
    color: var(--muted);
    font-size: 0.9rem;
    margin: 0 0 22px;
    text-align: center;
  }
  #camera-wrap {
    position: relative;
    width: 100%;
    max-width: 420px;
    aspect-ratio: 1 / 1;
    background: #000;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 0 0 2px var(--accent-soft), 0 20px 50px rgba(0,0,0,0.45);
    border: 1px solid #2a2e37;
  }
  #webcam-container video, #webcam-container canvas {
    width: 100% !important;
    height: 100% !important;
    object-fit: cover;
  }
  #scan-btn {
    margin-top: 22px;
    width: 100%;
    max-width: 420px;
    padding: 18px;
    font-size: 1.05rem;
    font-weight: 700;
    border: none;
    border-radius: 16px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: #0d0f14;
    cursor: pointer;
    box-shadow: 0 10px 30px var(--accent-soft);
    transition: transform 0.1s ease, opacity 0.2s ease;
  }
  #scan-btn:active { transform: scale(0.97); }
  #scan-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    box-shadow: none;
    background: #2a2e37;
    color: var(--muted);
  }
  #result-card {
    margin-top: 20px;
    width: 100%;
    max-width: 420px;
    background: linear-gradient(160deg, var(--card), var(--card2));
    border: 1px solid #2a2e37;
    border-radius: 18px;
    padding: 20px 22px;
    min-height: 60px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
  }
  #result-label {
    font-size: 1.6rem;
    font-weight: 800;
    background: linear-gradient(90deg, #fff, #cfd0ff);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  #result-conf {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 4px;
  }
  #status {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 12px;
    text-align: center;
    min-height: 18px;
  }
  .bar-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
    font-size: 0.75rem;
    color: var(--muted);
  }
  .bar-track {
    flex: 1;
    height: 7px;
    background: #12141a;
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid #2a2e37;
  }
  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 0.4s ease;
  }
  footer {
    margin-top: 32px;
    font-size: 0.78rem;
    color: var(--muted);
    text-align: center;
  }
  footer a {
    color: var(--accent2);
    text-decoration: none;
    font-weight: 600;
  }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="logo-badge">
  <svg width="28" height="28" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M 10 17 V 13 C 10 11.3 11.3 10 13 10 H 17" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 31 10 H 35 C 36.7 10 38 11.3 38 13 V 17" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 38 31 V 35 C 38 36.7 36.7 38 35 38 H 31" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 17 38 H 13 C 11.3 38 10 36.7 10 35 V 31" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 18 16.5 H 30" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 18 21.5 H 28.5" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 21.5 16.5 V 21.5 C 26.5 21.5 26.5 27.5 21.5 27.5" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 21.5 27.5 L 28.5 34" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round"/>
  </svg>
</div>
<h1 id="app-title">Currency Note Identifier</h1>
<p class="subtitle">Point the camera at a note, then tap Scan</p>

<div id="camera-wrap">
  <div id="webcam-container"></div>
</div>

<button id="scan-btn" disabled>Loading model…</button>

<div id="result-card">
  <div id="result-label">—</div>
  <div id="result-conf"></div>
  <div id="all-bars"></div>
</div>

<div id="status"></div>

<footer>
  Runs fully on-device • No data leaves your browser<br>
  <a id="present-link" href="presentation.html" style="color:var(--accent); text-decoration:none;">How it works →</a>
</footer>

<!-- TensorFlow.js and Teachable Machine image library -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

<script>
// ---- CONFIGURE THIS ----
// Point to your exported model folder (containing model.json, metadata.json, weights.bin)
// This can be a local relative path (e.g. "./model/") for fully offline use,
// or a hosted URL if using Teachable Machine's shareable link / Firebase.
const MODEL_URL = "./model/";
// -------------------------

// ---- SINGLE POINT PROJECT NAME CONFIG ----
const PROJECT_NAME = "CurrenSee";
// -------------------------------------------

let model, webcam, maxPredictions;
let isScanning = false;
let voices = [];

const scanBtn = document.getElementById("scan-btn");
const resultLabel = document.getElementById("result-label");
const resultConf = document.getElementById("result-conf");
const allBars = document.getElementById("all-bars");
const statusEl = document.getElementById("status");

const CONFIDENCE_THRESHOLD = 0.75; // below this, ask user to try again

function loadVoices() {
  voices = window.speechSynthesis.getVoices();
}
if ("speechSynthesis" in window) {
  window.speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();
}

async function init() {
  try {
    statusEl.textContent = "Loading model…";
    const modelURL = MODEL_URL + "model.json";
    const metadataURL = MODEL_URL + "metadata.json";
    model = await tmImage.load(modelURL, metadataURL);
    maxPredictions = model.getTotalClasses();

    statusEl.textContent = "Requesting camera access…";
    const flip = false; // set true if using front-facing camera and want mirror
    webcam = new tmImage.Webcam(320, 320, flip);
    await webcam.setup({ facingMode: "environment" }); // rear camera on phones
    await webcam.play();
    document.getElementById("webcam-container").appendChild(webcam.canvas);

    requestAnimationFrame(loop);

    scanBtn.disabled = false;
    scanBtn.textContent = "Scan Note";
    statusEl.textContent = "Ready";
  } catch (err) {
    console.error(err);
    statusEl.textContent = "Error: " + err.message + " (check model path / camera permission)";
  }
}

async function loop() {
  webcam.update();
  requestAnimationFrame(loop);
}

async function scan() {
  if (isScanning) return;
  isScanning = true;
  scanBtn.disabled = true;
  scanBtn.textContent = "Scanning…";

  const predictions = await model.predict(webcam.canvas);
  predictions.sort((a, b) => b.probability - a.probability);

  renderBars(predictions);

  const top = predictions[0];
  const label = top.className;
  const conf = top.probability;

  if (conf < CONFIDENCE_THRESHOLD) {
    resultLabel.textContent = "Not sure — try again";
    resultConf.textContent = `(best guess: ${label}, ${(conf * 100).toFixed(0)}%)`;
    speak("Could not identify clearly. Please try again.");
  } else if (label.toLowerCase() === "invalid") {
    resultLabel.textContent = "No valid note detected";
    resultConf.textContent = `${(conf * 100).toFixed(0)}% confidence`;
    speak("No currency note detected.");
  } else {
    resultLabel.textContent = `₹${label} Note`;
    resultConf.textContent = `${(conf * 100).toFixed(0)}% confidence`;
    speak(`${label} rupee note`);
  }

  isScanning = false;
  scanBtn.disabled = false;
  scanBtn.textContent = "Scan Note";
}

function renderBars(predictions) {
  allBars.innerHTML = "";
  predictions.forEach(p => {
    const row = document.createElement("div");
    row.className = "bar-row";
    const pct = (p.probability * 100).toFixed(0);
    row.innerHTML = `
      <span style="width:70px; flex-shrink:0;">${p.className}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <span style="width:36px; text-align:right;">${pct}%</span>
    `;
    allBars.appendChild(row);
  });
}

function speak(text) {
  if (!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel(); // stop any ongoing speech
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 0.95;
  utter.lang = "en-IN";
  const enVoice = voices.find(v => v.lang === "en-IN") || voices.find(v => v.lang.startsWith("en"));
  if (enVoice) utter.voice = enVoice;
  window.speechSynthesis.speak(utter);
}

scanBtn.addEventListener("click", scan);
window.addEventListener("load", () => {
  document.title = PROJECT_NAME + " — Currency Note Identifier";
  document.getElementById("app-title").textContent = PROJECT_NAME;
  init();
});
</script>

</body>
</html>
